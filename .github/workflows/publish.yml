name: stage-publish

permissions:
  id-token: write
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: polyester-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Stage the release onto npm
        run: npm stage publish
