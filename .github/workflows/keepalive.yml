name: keepalive

on:
  schedule:
    # instabox counts terminal/SSH traffic as activity, so the sandbox never
    # looks idle and never self-pauses (free plan: fixed 30m idle).
    # 20 minutes apart: under the 30m idle timeout, and ~1.5k runner minutes
    # a month (the free private-repo quota is 2k).
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: polyester-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          INSTABOX_SSH_KEY: ${{ secrets.INSTABOX_SSH_KEY }}
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$INSTABOX_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for attempt in 1 2 3; do
            ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $attempt failed, retrying"
            sleep 10
          done
          grep -qE "^[^#]*${HOST}" ~/.ssh/known_hosts

      - name: Keep the sandbox awake
        env:
          HOST: ${{ vars.INSTABOX_HOST }}
          PORT: ${{ vars.INSTABOX_PORT }}
          USER: ${{ vars.INSTABOX_USER }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if ssh -o BatchMode=yes -o ConnectTimeout=20 -p "$PORT" "$USER@$HOST" '
              date -u > /var/tmp/keepalive.last
              # a wedged bot still shows as active: the heartbeat tells the truth
              hb=$(cat /var/tmp/polyester.heartbeat 2>/dev/null || echo 0)
              now=$(date +%s)
              if [ "$hb" -gt 0 ] && [ $((now - hb)) -gt 300 ]; then
                echo "heartbeat $((now - hb))s old -> restarting polyester-bot"
                sudo systemctl restart polyester-bot
                sleep 15
              fi
              s=$(systemctl is-active polyester-bot || true)
              if [ "$s" != active ]; then
                sudo systemctl restart polyester-bot
                sleep 15
                s=$(systemctl is-active polyester-bot || true)
              fi
              echo "bot=$s heartbeat_age=$((now - hb))s"
              [ "$s" = active ]'; then
              echo "keepalive ok (attempt $attempt)"
              exit 0
            fi
            echo "ssh attempt $attempt failed (machine may be waking up), retrying"
            sleep 20
          done
          echo "keepalive FAILED: sandbox unreachable" >&2
          exit 1
